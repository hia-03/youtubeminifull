{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Video</title>
  <link rel="stylesheet" href="{% static 'src/output.css' %}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-purple-400 via-pink-400 to-red-400 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Добавить видео</h1>

    <form action="" method="post" enctype="multipart/form-data" class="space-y-5">
      {% csrf_token %}

   
      <div>
        <label class="block text-gray-700 font-medium mb-1">Название видео</label>
        <input type="text" 
               name="title" 
               placeholder="Напишите имя видео" 
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1">Описание видео</label>
        <textarea name="description" 
                  placeholder="Напишите описание видео" 
                  rows="3"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
      </div>

    
      <div>
        <label class="block text-gray-700 font-medium mb-1">Выберите видео</label>
        <input type="file" 
               name="video" 
               class="w-full text-gray-700 border border-gray-300 rounded-lg p-2 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
      </div>

  
      <button type="submit" 
              class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
        Сохранить
      </button>
    </form>
  </div>

</body>
</html>
