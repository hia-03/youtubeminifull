{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'src/output.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-purple-400 via-pink-400 to-red-400 min-h-screen flex items-center justify-center">

<form action="" method="post" enctype="multipart/form-data" class="bg-white p-10 rounded-xl shadow-2xl w-full max-w-md">
    {% csrf_token %}
    <section class="space-y-4">
        <h1 class="text-3xl font-bold text-center text-gray-800">Registration Form</h1>
        <p class="text-center text-gray-500 mb-4">Fill out the form carefully for Registration</p>
            {% if context %}
            <p>{{ context }}</p>
            {% endif %}
        <label class="block font-medium text-gray-700">First name</label>
        <input type="text" placeholder="input first_name" name="first_name"
               class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400 mb-2">

        <label class="block font-medium text-gray-700">Last name</label>
        <input type="text" placeholder="input Last_name" name="last_name"
               class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400 mb-2">

        <label class="block font-medium text-gray-700">Email</label>
        <input type="email" placeholder="input Email" name="email"
               class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400 mb-2">

        <label class="block font-medium text-gray-700">Username</label>
        <input type="text" placeholder="input Username" name="username"
               class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400 mb-2">

        <label class="block font-medium text-gray-700">Password</label>
        <input type="password" placeholder="input Password" name="password"
               class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400 mb-2">

        <label class="block font-medium text-gray-700">Password confirm</label>
        <input type="password" placeholder="input Password confirm" name="confirm"
               class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400 mb-2">

          <label class="block font-medium text-gray-700 mt-2">Фото профиля</label>
        <input type="file" name="image"
               class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400 mb-2">

        <label class="inline-flex items-center gap-2 mt-2">
            Я согласен с условиями
            <input type="checkbox" name="agreed_terms" class="accent-green-500">
        </label>

        <button type="submit"
                class="w-full mt-4 bg-purple-500 hover:bg-purple-600 text-white p-3 rounded-lg transition">
            Зарегистрироваться
        </button>
        <button type="reset"
                class="w-full mt-2 bg-gray-300 hover:bg-gray-400 text-gray-700 p-3 rounded-lg transition">
            Сброс
        </button>

    </section>
</form>

</body>
</html>
